<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mound Making · Chatuchak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed isometric model; a step card floats top-left, a 5-step rail sits along the bottom. Committed light "model table" look. */
:root{
  --table:#e8eae4;        /* the table the model sits on */
  --ink:#1d211c;          /* text, track */
  --ink-2:#596056;        /* secondary text */
  --rule:#c9cdc3;
  --card:rgba(250,251,248,.92);
  --race:#d9483b; --park:#4f9a5c; --water:#3f86c4; --soil:#a8774a; --neutral:#7d837a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 60% 40%,#f3f4f0 0%,var(--table) 70%)}
#nightsky{position:absolute;inset:0;background:radial-gradient(120% 90% at 55% 35%,#22304a 0%,#0b1019 75%);opacity:0;transition:opacity 1.2s}
#stage canvas{position:relative;display:block;width:100%;height:100%;outline:none;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;color:var(--ink);white-space:nowrap;transition:opacity .4s;text-shadow:0 0 3px #fff,0 0 6px #fff}
.lbl small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:0;color:var(--ink-2);margin-left:4px}
.lbl.bend{color:var(--race)} .lbl.mound{color:#2f6b3b} .lbl.basin{color:var(--water);font-size:14px} .lbl.tower{font-size:14px}

.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--rule);border-radius:4px;padding:18px 20px 16px;width:min(380px,100%);min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stepno{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.stepno b{font-family:var(--display);font-size:56px;line-height:.85;font-weight:700;color:var(--accent,var(--neutral));transition:color .4s}
.stepno h1{font-family:var(--display);font-size:26px;line-height:1;font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
.desc{font-size:14px;line-height:1.5;color:var(--ink);margin:12px 0 0;max-width:62ch}
.metric{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.metric strong{color:var(--accent,var(--ink));font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:7px 10px;color:var(--ink);cursor:pointer}
.fp .hint{display:none}
#fpbtn[aria-pressed="true"]{background:var(--race);color:#fff;border-color:var(--race)}
.viewinfo{margin-top:8px;margin-left:auto;max-width:330px;background:var(--card);border:1px solid var(--race);border-left:4px solid var(--race);border-radius:3px;padding:9px 11px;font-size:12.5px;line-height:1.45}
.viewinfo b{font-family:var(--display);font-size:19px;letter-spacing:.02em;color:var(--race)}
.viewinfo .pct{font-family:var(--display);font-size:30px;font-weight:700;color:var(--race);font-variant-numeric:tabular-nums;line-height:1}
.viewinfo small{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.cond{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--card)}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;border:0;background:transparent;padding:7px 9px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.seg button:focus-visible{outline:2px solid var(--race);outline-offset:-2px}
.chip[aria-pressed="true"]{background:var(--ink);color:#f4f5f1;border-color:var(--ink)}
.chip:focus-visible,.rail button:focus-visible,.nav:focus-visible{outline:2px solid var(--race);outline-offset:2px}

.bottom{display:flex;align-items:stretch;gap:10px}
.nav{font-family:var(--display);font-weight:600;font-size:20px;width:46px;flex:none;background:var(--card);border:1px solid var(--rule);border-radius:4px;color:var(--ink);cursor:pointer}
.nav.play{width:auto;padding:0 14px;font-size:15px;letter-spacing:.06em}
.rail{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;min-width:0}
.rail button{position:relative;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:9px 11px 11px;cursor:pointer;color:var(--ink);min-width:0;overflow:hidden}
.rail .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--c)}
.rail .t{display:block;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail button::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c)}
.rail button[aria-current="step"]{border-color:var(--c);background:#fff}
.rail button[aria-current="step"]::after{width:100%}
.rail button.done .n{opacity:.55}
.rail button .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--c);opacity:.35;width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hint{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;margin-top:6px}
.probs{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
.probs[hidden],.pstat[hidden]{display:none}
.probs .plabel{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.probs .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.probs button{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;text-align:left;background:#fff;border:1px solid var(--rule);border-left:3px solid var(--c);border-radius:3px;padding:7px 8px;color:var(--ink);cursor:pointer;transition:background .25s,color .25s;line-height:1.1}
.probs button small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:0;color:var(--ink-2);margin-top:2px;transition:color .25s}
.probs button[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.probs button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.probs button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.pstat{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pstat .big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;color:var(--pc,var(--ink));margin-right:6px}
.weeks{display:grid;grid-template-columns:repeat(52,1fr);gap:1.5px;margin-top:8px;height:12px}
.weeks i{background:#dcded8;border-radius:1px;transition:background .2s}
.weeks i.on{background:#a9ada5} .weeks i.race{background:var(--race)}
.lbl.prob{font-size:15px;padding:3px 7px;border-radius:3px;background:rgba(255,255,255,.88);text-shadow:none}
.lbl.prob.f{color:var(--water)} .lbl.prob.w{color:var(--race)} .lbl.prob.c{color:var(--race)}
@media (max-width:720px){
  .probs button{font-size:13px;padding:6px} .probs button small{display:none}
  .rail .t{display:none} .rail button{text-align:center;padding:8px 4px 10px}
  .card{padding:14px 14px 12px} .stepno b{font-size:42px} .stepno h1{font-size:21px} .desc{font-size:13px}
  .top{flex-direction:column} .tools{justify-content:flex-start} .hint{display:none}
  .ui{justify-content:flex-start;gap:10px} .bottom{margin-top:auto}
}
@media (max-width:720px) and (max-height:760px){ .desc{display:none} }
</style>

        <div class="seg"><button type="button" data-c="night" data-v="0" style="--c:#7d837a">DAY</button><button type="button" data-c="night" data-v="1" style="--c:#22304a">NIGHT</button></div>

      <div class="viewinfo" id="viewinfo" hidden></div>

    </div>
  </div>
  <div class="bottom">
    <button class="nav" id="prev" type="button" aria-label="Previous step">‹</button>

    <button class="nav play" id="play" type="button" aria-pressed="false">PLAY</button>
  </div>

const delay = {}; let step = 0;
function targetsFor(n){

    m: [0,1,2,3].map(()=> n<2?0 : n===2?0.73:1), basin: n>=3?1:0, soil: n===3?1:0, deck: n>=4?1:0, tw:[0,1,2,3].map(()=> n>=4?1:0), cab: n>=4?1:0};

function setStep(n, user){

    else { T[k]=t[k]; delay[k] = now + (k==='cab'?1900: k==='deck'?150 : k==='soil'?600 : 0); }
  }

function snapAll(){ for (const k in T){ if (Array.isArray(T[k])) T[k].forEach((v,i)=>S[k][i]=v); else S[k]=T[k]; } }

function advance(dt, now){
  let moved = false;
  for (const k in T){
    const go = (cur, tgt, key) => { if (now < (delay[key]||0)) return cur; const d = tgt - cur; if (Math.abs(d) < 1e-4) return tgt; moved = true; const s = RATE[k]*dt; return cur + Math.sign(d)*Math.min(Math.abs(d), s); };

}

const terrainMat = new THREE.ShaderMaterial({
  uniforms:{ L:{value:new THREE.Vector3(-0.45,0.8,0.35).normalize()}, uNight:{value:0}, uFlood:{value:0}, uBasin:{value:1}, uPoolN:{value:0}, uView:{value:0}, uVis:{value:null}, uGrid:{value:new THREE.Vector4(0,0,1,1)}, uDim:{value:new THREE.Vector2(1,1)}, uPools:{value:Array.from({length:32},()=>new THREE.Vector3())}, uSplit:{value:0}, uWet:{value:0} },

  fragmentShader:`uniform vec3 L; uniform float uNight; uniform float uFlood; uniform float uBasin; uniform int uPoolN; uniform float uView; uniform sampler2D uVis; uniform vec4 uGrid; uniform vec2 uDim; uniform vec3 uPools[32]; uniform float uSplit; uniform float uWet; varying float vh; varying float vside; varying vec3 vn; varying vec2 vxz;

const fans = [];
for (const k of 'ABCD'){

  const s = new THREE.Shape(); s.moveTo(0,0); const pts=[new THREE.Vector3(0,0,0)];

soilMesh.frustumCulled = false; scene.add(soilMesh);

const dummy = new THREE.Object3D();

const arcs = flights.map(f=>{ const a=W(f.from[0],f.from[1],0), b=W(f.to[0],f.to[1],f.to[2]*VS), c=a.clone().lerp(b,.5); c.y += 45;

const deckMat = new THREE.MeshLambertMaterial({color:COL.soil});
let decks = [];
function buildDeck(){
  decks.forEach(d=>{ scene.remove(d); d.geometry.dispose(); });
  decks = D.deck.map(P=>{
    const pts=[]; P.forEach(p=>{ const v=W(p[0],p[1],p[2]*VS); if(!pts.length || pts[pts.length-1].distanceTo(v)>0.5) pts.push(v); });
    const closed = pts[0].distanceTo(pts[pts.length-1]) < 1; if (closed) pts.pop();
    const curve = new THREE.CatmullRomCurve3(pts, closed, 'centripetal');
    const seg = pts.length*3, g = new THREE.TubeGeometry(curve, seg, 2.3, 8, closed);

  });
}
const towerMat = new THREE.MeshLambertMaterial({color:COL.concrete}), podMat = new THREE.MeshLambertMaterial({color:0x9fc0d2}), coreMat = new THREE.MeshLambertMaterial({color:0x7a8794});

function buildTowers(){

    const p2 = new THREE.Mesh(new THREE.CylinderGeometry(7,9.5,3,32).translate(0,ph+1.5,0), towerMat); g.add(p2);
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,1.2,20).translate(0,H-4,0), coreMat); g.add(ring);
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.3,10,8).translate(0,H+5,0), coreMat); g.add(mast);
    g.position.copy(W(t.base[0],t.base[1],t.base[2]*VS));

}
