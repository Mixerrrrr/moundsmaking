<style>
/* Layout: one full-bleed isometric model; a step card floats top-left, a 5-step rail sits along the bottom. Committed light "model table" look. */
:root{
  --table:#e8eae4;        /* the table the model sits on */
  --ink:#1d211c;          /* text, track */
  --ink-2:#596056;        /* secondary text */
  --rule:#c9cdc3;
  --card:rgba(250,251,248,.92);
  --race:#d9483b; --park:#4f9a5c; --water:#3f86c4; --soil:#a8774a; --neutral:#7d837a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 60% 40%,#f3f4f0 0%,var(--table) 70%)}
#nightsky{position:absolute;inset:0;background:radial-gradient(120% 90% at 55% 35%,#22304a 0%,#0b1019 75%);opacity:0;transition:opacity 1.2s}
#stage canvas{position:relative;display:block;width:100%;height:100%;outline:none;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;color:var(--ink);white-space:nowrap;transition:opacity .4s;text-shadow:0 0 3px #fff,0 0 6px #fff}
.lbl small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:0;color:var(--ink-2);margin-left:4px}
.lbl.bend{color:var(--race)} .lbl.mound{color:#2f6b3b} .lbl.basin{color:var(--water);font-size:14px} .lbl.tower{font-size:14px}

.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--rule);border-radius:4px;padding:18px 20px 16px;width:min(380px,100%);min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stepno{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.stepno b{font-family:var(--display);font-size:56px;line-height:.85;font-weight:700;color:var(--accent,var(--neutral));transition:color .4s}
.stepno h1{font-family:var(--display);font-size:26px;line-height:1;font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
.desc{font-size:14px;line-height:1.5;color:var(--ink);margin:12px 0 0;max-width:62ch}
.metric{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.metric strong{color:var(--accent,var(--ink));font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:7px 10px;color:var(--ink);cursor:pointer}
.cond{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--card)}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;border:0;background:transparent;padding:7px 9px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.seg button:focus-visible{outline:2px solid var(--race);outline-offset:-2px}
.chip[aria-pressed="true"]{background:var(--ink);color:#f4f5f1;border-color:var(--ink)}
.chip:focus-visible,.rail button:focus-visible,.nav:focus-visible{outline:2px solid var(--race);outline-offset:2px}

.bottom{display:flex;align-items:stretch;gap:10px}
.nav{font-family:var(--display);font-weight:600;font-size:20px;width:46px;flex:none;background:var(--card);border:1px solid var(--rule);border-radius:4px;color:var(--ink);cursor:pointer}
.nav.play{width:auto;padding:0 14px;font-size:15px;letter-spacing:.06em}
.rail{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;min-width:0}
.rail button{position:relative;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:9px 11px 11px;cursor:pointer;color:var(--ink);min-width:0;overflow:hidden}
.rail .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--c)}
.rail .t{display:block;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail button::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c)}
.rail button[aria-current="step"]{border-color:var(--c);background:#fff}
.rail button[aria-current="step"]::after{width:100%}
.rail button.done .n{opacity:.55}
.rail button .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--c);opacity:.35;width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hint{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;margin-top:6px}
@media (max-width:720px){
  .rail .t{display:none} .rail button{text-align:center;padding:8px 4px 10px}
  .card{padding:14px 14px 12px} .stepno b{font-size:42px} .stepno h1{font-size:21px} .desc{font-size:13px}
  .top{flex-direction:column} .tools{justify-content:flex-start} .hint{display:none}
  .ui{justify-content:flex-start;gap:10px} .bottom{margin-top:auto}
}
@media (max-width:720px) and (max-height:760px){ .desc{display:none} }
</style>
</head><body>

    <button class="nav play" id="play" type="button" aria-pressed="false">PLAY</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const D = JSON.parse(document.getElementById('site').textContent);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL = {race:0xd9483b, park:0x4f9a5c, water:0x3f86c4, soil:0xa8774a, ink:0x1d211c, track:0x3a3d39, concrete:0xdcd9d2};
const STEPS = [
  {c:'#7d837a', t:'The circuit bends', d:'Cars brake and turn hard at four bends, A to D. Centrifugal force throws energy, and debris, to the outside of each curve.', m:'4 bends · A B C D'},
  {c:'#d9483b', t:'Outside = safety + view', d:'Run-off and the best view are both on the outside of every bend. That is where the crowd wants to be, and where the earth should go.', m:'fan ±50° · 55 m from each apex'},
  {c:'#4f9a5c', t:'Fan mounds rise', d:'A fan of earth opens from each apex, facing the bend. The front face is a grass grandstand, 6–10 m high; the back faces the park.', m:'<strong>63,500 m³</strong> of fill across 4 mounds · <strong>73%</strong> brought in'},
  {c:'#a8774a', t:'Soil from the other side', d:'The rest of the earth is dug from the inside of the next bend. Four sunken basins feed the mounds and hold the flood in the monsoon.', m:'cut <strong>17,450 m³</strong> → <strong>27%</strong> of the fill · stores <strong>12,850 m³</strong>'},
  {c:'#1d211c', t:'Crest → Skyloop + towers', d:'The crests join into one walkway above the track. Towers on the mound backs hang it: A, C and D at 56 m, B at 82 m leaning over the roundabout.', m:'deck +8–12 m · towers 56 m / <strong>82 m</strong>'}
];

// ---------- renderer / scene / camera ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1,1,1,-1,-2000,4000);
const HOME_DIR = new THREE.Vector3(0.82, 0.78, 1.0).normalize();
const target0 = new THREE.Vector3(0, 10, 0);
let viewSize = 330;
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.3;
controls.minZoom = 0.6; controls.maxZoom = 5; controls.enablePan = true; controls.screenSpacePanning = true;
function home(){ cam.position.copy(target0).addScaledVector(HOME_DIR, 900); controls.target.copy(target0); cam.zoom = 1; cam.updateProjectionMatrix(); controls.update(); }
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false);
  const a = w/h; viewSize = a < 0.8 ? 470 : 330; const vs = viewSize;
  cam.left = -vs*a/2; cam.right = vs*a/2; cam.top = vs/2; cam.bottom = -vs/2; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
const hemi = new THREE.HemisphereLight(0xffffff, 0xb9bdb2, 1.25); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-200, 400, 150); scene.add(sun);

// ---------- coordinates ----------
const cx = D.x0 + (D.nx - 1)*D.st/2, cy = D.y0 + (D.ny - 1)*D.st/2;
const W = (x, y, h = 0) => new THREE.Vector3(x - cx, h, -(y - cy));
let VS = 1.5;

// ---------- state + animation ----------
const S = {track:0, arrows:0, fanS:0, fanO:0, m:[0,0,0,0], basin:0, soil:0, deck:0, tw:[0,0,0,0], cab:0};
const T = JSON.parse(JSON.stringify(S));
const delay = {}; let step = 0;
function targetsFor(n){
  return {track:1, arrows: n===0?1:n===1?0.3:0, fanS: (n===1||n===2)?1:0, fanO: n===1?1:0.28,
    m: [0,1,2,3].map(()=> n<2?0 : n===2?0.73:1), basin: n>=3?1:0, soil: n===3?1:0, deck: n>=4?1:0, tw:[0,1,2,3].map(()=> n>=4?1:0), cab: n>=4?1:0};
}
function setStep(n, user){
  step = Math.max(0, Math.min(4, n));
  const t = targetsFor(step), now = performance.now();
  for (const k in t){
    if (Array.isArray(t[k])) t[k].forEach((v,i)=>{ T[k][i]=v; delay[k+i] = now + (k==='m'? i*260 : k==='tw'? 900+i*260 : 0); });
    else { T[k]=t[k]; delay[k] = now + (k==='cab'?1900: k==='deck'?150 : k==='soil'?600 : 0); }
  }
  if (RM){ snapAll(); if (typeof updateTerrain==='function' && tg) updateTerrain(); }
  const s = STEPS[step];
  document.documentElement.style.setProperty('--accent', s.c);
  document.getElementById('no').textContent = '0' + (step+1);
  document.getElementById('ttl').textContent = s.t;
  document.getElementById('desc').textContent = s.d;
  document.getElementById('metric').innerHTML = s.m;
  rail.querySelectorAll('button').forEach((b,i)=>{ b.setAttribute('aria-current', i===step?'step':'false'); b.classList.toggle('done', i<step); });
  try{ localStorage.setItem('mound-step', String(step)); }catch(e){}
  if (user) stopPlay();
}
function snapAll(){ for (const k in T){ if (Array.isArray(T[k])) T[k].forEach((v,i)=>S[k][i]=v); else S[k]=T[k]; } }
const RATE = {track:0.55, arrows:2.5, fanS:1.6, fanO:2, m:0.55, basin:0.6, soil:2, deck:0.55, tw:0.7, cab:1.2};
function advance(dt, now){
  let moved = false;
  for (const k in T){
    const go = (cur, tgt, key) => { if (now < (delay[key]||0)) return cur; const d = tgt - cur; if (Math.abs(d) < 1e-4) return tgt; moved = true; const s = RATE[k]*dt; return cur + Math.sign(d)*Math.min(Math.abs(d), s); };
    if (Array.isArray(T[k])) T[k].forEach((v,i)=> S[k][i] = go(S[k][i], v, k+i)); else S[k] = go(S[k], T[k], k);
  }
  return moved;
}
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

// ---------- terrain (heightfield + model plinth) ----------
const nx = D.nx, ny = D.ny, N = nx*ny;
const mound = Float32Array.from(D.mound, v=>v/20), basin = Float32Array.from(D.basin, v=>v/20), mid = Int8Array.from(D.mid);
const tg = new THREE.BufferGeometry();
const pos = new Float32Array(N*3), hreal = new Float32Array(N);
for (let j=0;j<ny;j++) for (let i=0;i<nx;i++){ const k=j*nx+i; const v = W(D.x0+i*D.st, D.y0+j*D.st); pos[k*3]=v.x; pos[k*3+2]=v.z; }
const idx = [];
for (let j=0;j<ny-1;j++) for (let i=0;i<nx-1;i++){ const a=j*nx+i, b=a+1, c=a+nx, d=c+1; idx.push(a,b,c, b,d,c); }
tg.setIndex(idx); tg.setAttribute('position', new THREE.BufferAttribute(pos,3)); tg.setAttribute('hreal', new THREE.BufferAttribute(hreal,1));
const terrainMat = new THREE.ShaderMaterial({
  uniforms:{ L:{value:new THREE.Vector3(-0.45,0.8,0.35).normalize()}, uNight:{value:0}, uFlood:{value:0}, uBasin:{value:1}, uPoolN:{value:0}, uPools:{value:Array.from({length:32},()=>new THREE.Vector3())} },
  vertexShader:`attribute float hreal; varying float vh; varying vec3 vn; varying vec2 vxz;
    void main(){ vh=hreal; vn=normalize(normalMatrix*normal); vxz=position.xz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 L; uniform float uNight; uniform float uFlood; uniform float uBasin; uniform int uPoolN; uniform vec3 uPools[32]; varying float vh; varying vec3 vn; varying vec2 vxz;
    void main(){
      vec3 ground=vec3(0.878,0.894,0.858);

const nightsky = document.getElementById('nightsky');
function setCond(k, v){ COND[k]=v; if (step<4) setStep(4, true); syncCondUI(); try{ localStorage.setItem('mound-cond', JSON.stringify(COND)); }catch(e){} if (RM) Object.assign(CS, COND); }
function syncCondUI(){ document.querySelectorAll('.cond button').forEach(b=>b.setAttribute('aria-pressed', String(COND[b.dataset.c]===+b.dataset.v))); }
document.querySelectorAll('.cond button').forEach(b=>b.addEventListener('click', ()=>setCond(b.dataset.c, +b.dataset.v)));
try{ const c=JSON.parse(localStorage.getItem('mound-cond')||'null'); if (c){ Object.assign(COND,c); Object.assign(CS,c); } }catch(e){}
syncCondUI();
const dmy = new THREE.Object3D(), deckGlow = new THREE.Color(0xffc985), podGlow = new THREE.Color(0xffe2b0);
function applyConditions(now, dt){
  for (const k in COND){ CS[k] += (COND[k]-CS[k])*Math.min(1, dt*2.2); if (Math.abs(COND[k]-CS[k])<1e-3) CS[k]=COND[k]; }
  const built = ease(S.deck)*ease(S.tw[3]);           // conditions only show on the finished park
  const race = CS.race*built, park = (1-CS.race)*built, fl = CS.flood*built, ni = CS.night;
  fenceMat.opacity = 0.7*race; fences.forEach(m=>m.visible = race>0.01);
  const cb = crowd.userData.base||[]; cb.forEach((b,i)=>{ dmy.position.copy(b); dmy.scale.set(1, Math.max(race,0.001), 1); dmy.updateMatrix(); crowd.setMatrixAt(i, dmy.matrix); }); crowd.instanceMatrix.needsUpdate = true; crowd.visible = race>0.01;
  const pb = parkCrowd.userData.base||[]; pb.forEach((b,i)=>{ const k=parkPts[i].kind; const sc = park*(k===2?(1-fl):1); dmy.position.copy(b); if (k===1){ dmy.position.x += Math.sin(now/1500+i)*2; } dmy.scale.set(1, Math.max(sc,0.001), 1); dmy.updateMatrix(); parkCrowd.setMatrixAt(i, dmy.matrix); }); parkCrowd.instanceMatrix.needsUpdate = true; parkCrowd.visible = park>0.01;
  loopLine.material.opacity = 0.9*park;
  waterMat.opacity = 0.85*fl; waters.forEach(w=>w.visible = fl>0.01);
  rain.material.opacity = 0.55*fl; rain.visible = fl>0.01;
  if (fl>0.01){ for (let i=0;i<RN;i++){ let y=rainPos[i*6+1]-dt*90; if (y<0) y+=170; rainPos[i*6+1]=y; rainPos[i*6+4]=y-3.2; } rainG.attributes.position.needsUpdate = true; }
  const bt = step<4 ? 1 : CS.flood; terrainMat.uniforms.uBasin.value += (bt-terrainMat.uniforms.uBasin.value)*Math.min(1,dt*2.2); if (RM) terrainMat.uniforms.uBasin.value = bt;
  terrainMat.uniforms.uFlood.value = fl; terrainMat.uniforms.uNight.value = ni;
  nightsky.style.opacity = ni;
  hemi.intensity = 1.25*(1-0.82*ni) * (1-0.25*fl); sun.intensity = 1.6*(1-0.92*ni)*(1-0.4*fl);
  deckMat.emissive.copy(deckGlow).multiplyScalar(0.55*ni); podMat.emissive.copy(podGlow).multiplyScalar(0.7*ni);
  trackMesh.material.emissive.setRGB(0.32*ni*race, 0.31*ni*race, 0.27*ni*race);
  coneMat.opacity = 0.16*ni*ease(S.tw[3]); cones.forEach(m=>m.visible = ni>0.01 && S.tw[3]>0.5);
  car.visible = car.visible && race>0.5;
}

// ---------- per-frame ----------
function applyAnim(now = performance.now()){
  trG.setDrawRange(0, Math.floor(ease(S.track)*trI.length/6)*6);
  arrowMat.opacity = S.arrows;
  arrows.forEach(m=>{ m.visible = S.arrows>0.01; if(m.userData.dir){ const o=(Math.sin(now/380 + m.userData.ph)*0.5+0.5)*5; m.position.copy(m.userData.base).addScaledVector(m.userData.dir, o); } });
  fans.forEach(f=>{ const s=ease(S.fanS); f.scale.setScalar(Math.max(s,0.001)); f.visible = s>0.01; });
  fanMat.opacity = 0.2*S.fanO; fanLineMat.opacity = S.fanO;
  decks.forEach(d=>{ d.geometry.setDrawRange(0, Math.floor(ease(S.deck)*d.userData.total/3)*3); d.visible = S.deck>0.001; });
  towers.forEach((o,i)=>{ const s=ease(S.tw[i]); o.g.scale.set(1, Math.max(s,0.001), 1); o.g.visible = s>0.01; });
  if (cables) cables.material.opacity = 0.55*S.cab;
  arcMat.opacity = 0.7*S.soil;
  // soil chunks
  let n=0;
  arcs.forEach((o,fi)=>{ for (let i=0;i<soilN;i++){ const t=((now/2600) + i/soilN + fi*0.13)%1; if (S.soil>0.02){ o.curve.getPoint(t, dummy.position); dummy.scale.setScalar(S.soil*(0.6+0.6*Math.sin(i*7.1)**2)); dummy.rotation.set(i,t*6,0); } else dummy.scale.setScalar(0); dummy.updateMatrix(); soilMesh.setMatrixAt(n++, dummy.matrix); } });
  soilMesh.instanceMatrix.needsUpdate = true;
  // car laps the circuit section
  carT = (carT + 0.0016)%1; const cp = centre.getPointAt(carT), ct = centre.getTangentAt(carT);
  car.position.copy(cp); car.position.y = 1.2; car.rotation.y = Math.atan2(-ct.z, ct.x); car.visible = S.track>0.98;
}
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  const before = S.m.join()+S.basin;
  advance(dt, now);
  if (S.m.join()+S.basin !== before) updateTerrain();
  applyAnim(now); applyConditions(now, dt);
  if (playing){ const p = (now-playT)/PLAY_MS; const bar = rail.children[step]?.querySelector('.bar'); if (bar) bar.style.width = Math.min(100,p*100)+'%';
    if (p>=1){ if (step<4){ setStep(step+1); playT=now; rail.querySelectorAll('.bar').forEach(b=>b.style.width='0'); } else stopPlay(); } }
  controls.update(); renderer.render(scene, cam); placeLabels();
  requestAnimationFrame(frame);
}
resize(); home();
updateTerrain(); buildDeck(); buildTowers(); buildCond();
let start = 0; try{ const s = parseInt(localStorage.getItem('mound-step')); if (s>=0 && s<5) start = s; }catch(e){}
setStep(start);
S.track = 1;
requestAnimationFrame(frame);
</script>

</body></html>
