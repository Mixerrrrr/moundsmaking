<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed isometric model; a step card floats top-left, a 5-step rail sits along the bottom. Committed light "model table" look. */
:root{
  --table:#e8eae4;        /* the table the model sits on */
  --ink:#1d211c;          /* text, track */
  --ink-2:#596056;        /* secondary text */
  --rule:#c9cdc3;
  --card:rgba(250,251,248,.92);
  --race:#d9483b; --park:#4f9a5c; --water:#3f86c4; --soil:#a8774a; --neutral:#7d837a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 60% 40%,#f3f4f0 0%,var(--table) 70%)}
#stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;color:var(--ink);white-space:nowrap;transition:opacity .4s;text-shadow:0 0 3px #fff,0 0 6px #fff}
.lbl small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:0;color:var(--ink-2);margin-left:4px}
.lbl.bend{color:var(--race)} .lbl.mound{color:#2f6b3b} .lbl.basin{color:var(--water);font-size:14px} .lbl.tower{font-size:14px}

.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--rule);border-radius:4px;padding:18px 20px 16px;width:min(380px,100%);min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stepno{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.stepno b{font-family:var(--display);font-size:56px;line-height:.85;font-weight:700;color:var(--accent,var(--neutral));transition:color .4s}
.stepno h1{font-family:var(--display);font-size:26px;line-height:1;font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
.desc{font-size:14px;line-height:1.5;color:var(--ink);margin:12px 0 0;max-width:62ch}
.metric{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.metric strong{color:var(--accent,var(--ink));font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:7px 10px;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#f4f5f1;border-color:var(--ink)}
.chip:focus-visible,.rail button:focus-visible,.nav:focus-visible{outline:2px solid var(--race);outline-offset:2px}

.bottom{display:flex;align-items:stretch;gap:10px}
.nav{font-family:var(--display);font-weight:600;font-size:20px;width:46px;flex:none;background:var(--card);border:1px solid var(--rule);border-radius:4px;color:var(--ink);cursor:pointer}
.nav.play{width:auto;padding:0 14px;font-size:15px;letter-spacing:.06em}
.rail{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;min-width:0}
.rail button{position:relative;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:9px 11px 11px;cursor:pointer;color:var(--ink);min-width:0;overflow:hidden}
.rail .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--c)}
.rail .t{display:block;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail button::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c)}
.rail button[aria-current="step"]{border-color:var(--c);background:#fff}
.rail button[aria-current="step"]::after{width:100%}
.rail button.done .n{opacity:.55}
.rail button .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--c);opacity:.35;width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hint{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;margin-top:6px}
@media (max-width:720px){
  .rail .t{display:none} .rail button{text-align:center;padding:8px 4px 10px}
  .card{padding:14px 14px 12px} .stepno b{font-size:42px} .stepno h1{font-size:21px} .desc{font-size:13px}
  .top{flex-direction:column} .tools{justify-content:flex-start} .hint{display:none}
  .ui{justify-content:flex-start;gap:10px} .bottom{margin-top:auto}
}
@media (max-width:720px) and (max-height:760px){ .desc{display:none} }
</style>
</head><body>

</div>

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9bdb2, 1.25));

// ---------- coordinates ----------
const cx = D.x0 + (D.nx - 1)*D.st/2, cy = D.y0 + (D.ny - 1)*D.st/2;
const W = (x, y, h = 0) => new THREE.Vector3(x - cx, h, -(y - cy));
let VS = 1.5;

// ---------- state + animation ----------
const S = {track:0, arrows:0, fanS:0, fanO:0, m:[0,0,0,0], basin:0, soil:0, deck:0, tw:[0,0,0,0], cab:0};
const T = JSON.parse(JSON.stringify(S));
const delay = {}; let step = 0;
function targetsFor(n){
  return {track:1, arrows: n===0?1:n===1?0.3:0, fanS: (n===1||n===2)?1:0, fanO: n===1?1:0.28,
    m: [0,1,2,3].map(()=> n<2?0 : n===2?0.73:1), basin: n>=3?1:0, soil: n===3?1:0, deck: n>=4?1:0, tw:[0,1,2,3].map(()=> n>=4?1:0), cab: n>=4?1:0};
}
function setStep(n, user){
  step = Math.max(0, Math.min(4, n));
  const t = targetsFor(step), now = performance.now();
  for (const k in t){
    if (Array.isArray(t[k])) t[k].forEach((v,i)=>{ T[k][i]=v; delay[k+i] = now + (k==='m'? i*260 : k==='tw'? 900+i*260 : 0); });
    else { T[k]=t[k]; delay[k] = now + (k==='cab'?1900: k==='deck'?150 : k==='soil'?600 : 0); }
  }
  if (RM) snapAll();
  const s = STEPS[step];
  document.documentElement.style.setProperty('--accent', s.c);
  document.getElementById('no').textContent = '0' + (step+1);
  document.getElementById('ttl').textContent = s.t;
  document.getElementById('desc').textContent = s.d;
  document.getElementById('metric').innerHTML = s.m;
  rail.querySelectorAll('button').forEach((b,i)=>{ b.setAttribute('aria-current', i===step?'step':'false'); b.classList.toggle('done', i<step); });
  try{ localStorage.setItem('mound-step', String(step)); }catch(e){}
  if (user) stopPlay();
}
function snapAll(){ for (const k in T){ if (Array.isArray(T[k])) T[k].forEach((v,i)=>S[k][i]=v); else S[k]=T[k]; } }
const RATE = {track:0.55, arrows:2.5, fanS:1.6, fanO:2, m:0.55, basin:0.6, soil:2, deck:0.55, tw:0.7, cab:1.2};
function advance(dt, now){
  let moved = false;
  for (const k in T){
    const go = (cur, tgt, key) => { if (now < (delay[key]||0)) return cur; const d = tgt - cur; if (Math.abs(d) < 1e-4) return tgt; moved = true; const s = RATE[k]*dt; return cur + Math.sign(d)*Math.min(Math.abs(d), s); };
    if (Array.isArray(T[k])) T[k].forEach((v,i)=> S[k][i] = go(S[k][i], v, k+i)); else S[k] = go(S[k], T[k], k);
  }
  return moved;
}
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

// ---------- terrain (heightfield + model plinth) ----------
const nx = D.nx, ny = D.ny, N = nx*ny;
const mound = Float32Array.from(D.mound, v=>v/20), basin = Float32Array.from(D.basin, v=>v/20), mid = Int8Array.from(D.mid);
const tg = new THREE.BufferGeometry();
const pos = new Float32Array(N*3), hreal = new Float32Array(N);
for (let j=0;j<ny;j++) for (let i=0;i<nx;i++){ const k=j*nx+i; const v = W(D.x0+i*D.st, D.y0+j*D.st); pos[k*3]=v.x; pos[k*3+2]=v.z; }
const idx = [];
for (let j=0;j<ny-1;j++) for (let i=0;i<nx-1;i++){ const a=j*nx+i, b=a+1, c=a+nx, d=c+1; idx.push(a,b,c, b,d,c); }
tg.setIndex(idx); tg.setAttribute('position', new THREE.BufferAttribute(pos,3)); tg.setAttribute('hreal', new THREE.BufferAttribute(hreal,1));
const terrainMat = new THREE.ShaderMaterial({
  uniforms:{ L:{value:new THREE.Vector3(-0.45,0.8,0.35).normalize()} },
  vertexShader:`attribute float hreal; varying float vh; varying vec3 vn; varying vec2 vxz;
    void main(){ vh=hreal; vn=normalize(normalMatrix*normal); vxz=position.xz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 L; varying float vh; varying vec3 vn; varying vec2 vxz;
    void main(){
      vec3 ground=vec3(0.878,0.894,0.858);
      vec3 col=ground;
      if(vh>0.05){ float t=clamp(vh/10.,0.,1.); col=mix(vec3(0.74,0.85,0.68),vec3(0.27,0.55,0.32),t); }
      if(vh<-0.05){ float t=clamp(-vh/1.8,0.,1.); col=mix(vec3(0.72,0.82,0.92),vec3(0.30,0.53,0.77),t); }
      // 1 m contours, like the hand diagram
      float f=abs(fract(vh+0.5)-0.5); float w=fwidth(vh)*1.1;
      float line=(vh>0.35)?1.-smoothstep(0.,w,f):0.;
      col=mix(col,col*0.55,line*0.85);
      // faint 25 m site grid
      vec2 g=abs(fract(vxz/25.+0.5)-0.5); vec2 gw=fwidth(vxz/25.);
      float grid=1.-min(smoothstep(0.,gw.x*1.2,g.x),smoothstep(0.,gw.y*1.2,g.y));
      col=mix(col,col*0.93,grid*0.6);
      vec3 n=normalize(vn); vec3 Lv=normalize((viewMatrix*vec4(L,0.)).xyz);
      float dif=0.62+0.42*max(dot(n,Lv),0.);
      gl_FragColor=vec4(col*dif,1.);
    }`
});
const terrain = new THREE.Mesh(tg, terrainMat); scene.add(terrain);
// plinth: skirt around the edge down to a slab
const edge = [];
for (let i=0;i<nx;i++) edge.push(i); for (let j=1;j<ny;j++) edge.push(j*nx+nx-1); for (let i=nx-2;i>=0;i--) edge.push((ny-1)*nx+i); for (let j=ny-2;j>0;j--) edge.push(j*nx);
edge.push(0);
const sk = new Float32Array(edge.length*2*3), skI = [];
for (let e=0;e<edge.length-1;e++){ const a=e*2, b=a+2; skI.push(a,a+1,b, b,a+1,b+1); }
const skG = new THREE.BufferGeometry(); skG.setAttribute('position', new THREE.BufferAttribute(sk,3)); skG.setIndex(skI);
const skirt = new THREE.Mesh(skG, new THREE.MeshLambertMaterial({color:0xc4c8bd, side:THREE.DoubleSide})); scene.add(skirt);
const PL = -14;
function heightAt(k){ const id = mid[k]; return mound[k]*(id>=0 ? ease(S.m[id]) : 0) + basin[k]*ease(S.basin); }
function updateTerrain(){
  for (let k=0;k<N;k++){ const h = heightAt(k); hreal[k]=h; pos[k*3+1]=h*VS; }
  tg.attributes.position.needsUpdate = true; tg.attributes.hreal.needsUpdate = true; tg.computeVertexNormals();
  edge.forEach((k,e)=>{ const o=e*6; sk[o]=pos[k*3]; sk[o+1]=pos[k*3+1]; sk[o+2]=pos[k*3+2]; sk[o+3]=pos[k*3]; sk[o+4]=PL; sk[o+5]=pos[k*3+2]; });
  skG.attributes.position.needsUpdate = true; skG.computeVertexNormals(); skG.computeBoundingSphere(); tg.computeBoundingSphere();
}

// ---------- track ribbon (draws itself) ----------
const tr = D.track; const tl = [], tp = [];
for (let i=0;i<tr.length;i++){
  const a = tr[Math.max(0,i-1)], b = tr[Math.min(tr.length-1,i+1)];
  let dx=b[0]-a[0], dy=b[1]-a[1]; const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
  const hw = tr[i][3]/2, nxp=-dy*hw, nyp=dx*hw;
  tl.push(W(tr[i][0]+nxp, tr[i][1]+nyp, 0.35), W(tr[i][0]-nxp, tr[i][1]-nyp, 0.35));
  tp.push(W(tr[i][0], tr[i][1], 0.9));
}
const trG = new THREE.BufferGeometry().setFromPoints(tl); const trI = [];
for (let i=0;i<tr.length-1;i++){ const a=i*2; trI.push(a,a+1,a+2, a+2,a+1,a+3); }
trG.setIndex(trI); trG.computeVertexNormals();
const trackMesh = new THREE.Mesh(trG, new THREE.MeshLambertMaterial({color:COL.track, polygonOffset:true, polygonOffsetFactor:-2})); scene.add(trackMesh);
const centre = new THREE.CatmullRomCurve3(tp);
const car = new THREE.Mesh(new THREE.BoxGeometry(5.6,1.6,2.2), new THREE.MeshLambertMaterial({color:COL.race})); scene.add(car);
let carT = 0.05;

// ---------- step 1: force arrows at the bends ----------
function arrowShape(len, w){ const s = new THREE.Shape(); s.moveTo(0,-w/2); s.lineTo(len*0.62,-w/2); s.lineTo(len*0.62,-w*1.5); s.lineTo(len,0); s.lineTo(len*0.62,w*1.5); s.lineTo(len*0.62,w/2); s.lineTo(0,w/2); s.closePath(); return s; }
const arrowGeo = new THREE.ShapeGeometry(arrowShape(24, 2.6)); arrowGeo.rotateX(-Math.PI/2);
const arrowMat = new THREE.MeshBasicMaterial({color:COL.race, transparent:true, depthTest:false});
const arrows = [];
for (const k of 'ABCD'){
  const b = D.bends[k], ang = Math.atan2(b.out[1], b.out[0]);
  b.pts.forEach((p,i)=>{ const m = new THREE.Mesh(arrowGeo, arrowMat); m.position.copy(W(p[0],p[1],1.2)); m.rotation.y = ang; m.renderOrder = 5; m.userData = {dir:new THREE.Vector3(Math.cos(ang),0,-Math.sin(ang)), base:m.position.clone(), ph:i*0.7}; scene.add(m); arrows.push(m); });
  const dot = new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,1,24), arrowMat); dot.position.copy(W(b.p[0],b.p[1],1.2)); dot.renderOrder=5; scene.add(dot); arrows.push(dot);
}
// ---------- step 2: fans of view / run-off ----------
const fanMat = new THREE.MeshBasicMaterial({color:COL.race, transparent:true, opacity:.2, depthWrite:false, side:THREE.DoubleSide});
const fanLineMat = new THREE.LineDashedMaterial({color:COL.race, dashSize:3, gapSize:2.2, transparent:true});
const fans = [];
for (const k of 'ABCD'){
  const b = D.bends[k], a0 = Math.atan2(b.out[1], b.out[0]), r = 55;
  const s = new THREE.Shape(); s.moveTo(0,0); const pts=[new THREE.Vector3(0,0,0)];
  for (let i=0;i<=30;i++){ const a=a0-0.9+1.8*i/30; s.lineTo(Math.cos(a)*r, Math.sin(a)*r); pts.push(new THREE.Vector3(Math.cos(a)*r,0,-Math.sin(a)*r)); }
  s.closePath(); pts.push(new THREE.Vector3(0,0,0));
  const g = new THREE.ShapeGeometry(s); g.rotateX(-Math.PI/2);
  const grp = new THREE.Group(); grp.position.copy(W(b.p[0], b.p[1], 1.6));
  const fm = new THREE.Mesh(g, fanMat); fm.renderOrder = 4; grp.add(fm);
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), fanLineMat); ln.computeLineDistances(); grp.add(ln);
  for (const da of [-0.55,-0.18,0.18,0.55]){ // view arrows pointing back at the bend
    const am = new THREE.Mesh(new THREE.ShapeGeometry(arrowShape(30,1.4)).rotateX(-Math.PI/2), arrowMat); am.rotation.y = a0+da+Math.PI; am.position.set(Math.cos(a0+da)*46,0.2,-Math.sin(a0+da)*46); grp.add(am);
  }
  scene.add(grp); fans.push(grp);
}
// ---------- step 4: soil flying from basin to mound ----------
const soilN = 26, soilMesh = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1.5,0), new THREE.MeshLambertMaterial({color:COL.soil}), soilN*4);
soilMesh.frustumCulled = false; scene.add(soilMesh);
const flights = 'ABCD'.split('').map(k=>{ const bz = D.basins.find(b=>b.name===D.pair[k]); return {k, from:bz.c, to:D.mc[k]}; });
const dummy = new THREE.Object3D();
// arcs drawn as faint dashed guides
const arcMat = new THREE.LineDashedMaterial({color:COL.soil, dashSize:4, gapSize:3, transparent:true, opacity:0});
const arcs = flights.map(f=>{ const a=W(f.from[0],f.from[1],0), b=W(f.to[0],f.to[1],f.to[2]*VS), c=a.clone().lerp(b,.5); c.y += 45;
  const curve = new THREE.QuadraticBezierCurve3(a,c,b); const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(40)), arcMat); l.computeLineDistances(); scene.add(l); return {curve, line:l, f}; });
function rebuildArcs(){ arcs.forEach(o=>{ const f=o.f; const a=W(f.from[0],f.from[1],-1.2*VS), b=W(f.to[0],f.to[1],f.to[2]*VS*0.8), c=a.clone().lerp(b,.5); c.y += 45; o.curve.v0.copy(a); o.curve.v1.copy(c); o.curve.v2.copy(b); o.line.geometry.setFromPoints(o.curve.getPoints(40)); o.line.computeLineDistances(); }); }

// ---------- step 5: Skyloop deck, towers, cables ----------
const deckMat = new THREE.MeshLambertMaterial({color:COL.soil});
let decks = [];
function buildDeck(){
  decks.forEach(d=>{ scene.remove(d); d.geometry.dispose(); });
  decks = D.deck.map(P=>{
    const pts=[]; P.forEach(p=>{ const v=W(p[0],p[1],p[2]*VS); if(!pts.length || pts[pts.length-1].distanceTo(v)>0.5) pts.push(v); });
    const closed = pts[0].distanceTo(pts[pts.length-1]) < 1; if (closed) pts.pop();
    const curve = new THREE.CatmullRomCurve3(pts, closed, 'centripetal');
    const seg = pts.length*3, g = new THREE.TubeGeometry(curve, seg, 2.3, 8, closed);
    const m = new THREE.Mesh(g, deckMat); m.userData.total = g.index.count; scene.add(m); return m;
  });
}
const towerMat = new THREE.MeshLambertMaterial({color:COL.concrete}), podMat = new THREE.MeshLambertMaterial({color:0x9fc0d2}), coreMat = new THREE.MeshLambertMaterial({color:0x7a8794});
let towers = [], cables;
function buildTowers(){
  towers.forEach(t=>scene.remove(t.g)); if (cables){ scene.remove(cables); cables.geometry.dispose(); }
  towers = D.towers.map(t=>{
    const g = new THREE.Group(); const H = t.H*VS;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(1.6,4.2,H,24).translate(0,H/2,0), towerMat); g.add(shaft);
    const ph = H*t.pod;
    const p1 = new THREE.Mesh(new THREE.CylinderGeometry(9.5,7.5,2.5,32).translate(0,ph-1.25,0), podMat); g.add(p1);
    const p2 = new THREE.Mesh(new THREE.CylinderGeometry(7,9.5,3,32).translate(0,ph+1.5,0), towerMat); g.add(p2);
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,1.2,20).translate(0,H-4,0), coreMat); g.add(ring);
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.3,10,8).translate(0,H+5,0), coreMat); g.add(mast);
    g.position.copy(W(t.base[0],t.base[1],t.base[2]*VS));
    const ax = new THREE.Vector3(t.axis[0], t.axis[2], -t.axis[1]).normalize();
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), ax);
    g.scale.set(1,0.001,1); scene.add(g);
    const top = g.position.clone().addScaledVector(ax, H*0.97);
    return {g, top, t};
  });
  // cables: each deck point within 95 m (plan) hangs from the nearest tower; the ring from B
  const seg = [];
  D.deck.forEach((P,pi)=>P.forEach((p,i)=>{ if (i%3) return;
    let best=null, bd=1e9; towers.forEach(o=>{ const d=Math.hypot(o.t.base[0]-p[0], o.t.base[1]-p[1]); const pref = (pi===2 ? (o.t.k==='B'?0:1e9) : d); if (pref<bd && d<95 && d>10){ bd=pref; best=o; } });
    if (best){ const v=W(p[0],p[1],p[2]*VS); seg.push(best.top.x,best.top.y,best.top.z, v.x,v.y,v.z); } }));
  const cg = new THREE.BufferGeometry(); cg.setAttribute('position', new THREE.Float32BufferAttribute(seg,3));
  cables = new THREE.LineSegments(cg, new THREE.LineBasicMaterial({color:0x4a4f48, transparent:true, opacity:0})); scene.add(cables);
}

// ---------- labels ----------
const labelsEl = document.getElementById('labels'); const labels = [];

for (const k of 'ABCD'){
  const b = D.bends[k], i='ABCD'.indexOf(k), mc=D.mc[k];
  addLabel(k, 'bend', ()=>W(b.p[0]-b.out[0]*16, b.p[1]-b.out[1]*16, 2), ()=>step<2);

}
D.basins.forEach(b=> addLabel(`${b.name}<small>cut</small>`, 'basin', ()=>W(b.c[0],b.c[1],0), ()=>step===3 && S.basin>0.3));
D.towers.forEach(t=> addLabel(`${t.k}<small>${t.H} m</small>`, 'tower', ()=>{ const o=towers.find(x=>x.t.k===t.k); return o? o.top.clone().add(new THREE.Vector3(0,8,0)) : new THREE.Vector3(); }, ()=>step===4 && S.tw[0]>0.9));
const v3 = new THREE.Vector3();

  labels.forEach(l=>{ const on = l.showFn(); l.el.style.opacity = on?1:0; if(!on) return; v3.copy(l.posFn()).project(cam); l.el.style.left = ((v3.x+1)/2*w)+'px'; l.el.style.top = ((1-v3.y)/2*h)+'px'; });
}

// ---------- UI ----------
const rail = document.getElementById('rail');
STEPS.forEach((s,i)=>{ const b = document.createElement('button'); b.type='button'; b.style.setProperty('--c', s.c);
  b.innerHTML = `<span class="n">0${i+1}</span><span class="t">${s.t}</span><span class="bar"></span>`; b.addEventListener('click', ()=>setStep(i,true)); rail.appendChild(b); });
document.getElementById('prev').onclick = ()=>setStep(step-1,true);
document.getElementById('next').onclick = ()=>setStep(step+1,true);
addEventListener('keydown', e=>{ if(e.key==='ArrowRight') setStep(step+1,true); if(e.key==='ArrowLeft') setStep(step-1,true); });
document.getElementById('reset').onclick = home;
const vsBtn = document.getElementById('vs');
vsBtn.onclick = ()=>{ VS = VS===1.5 ? 1 : 1.5; vsBtn.textContent = VS===1.5 ? 'heights ×1.5' : 'true heights'; vsBtn.setAttribute('aria-pressed', VS===1.5); rebuildHeights(); };
let playing = false, playT = 0; const PLAY_MS = 6500; const playBtn = document.getElementById('play');
function stopPlay(){ playing=false; playBtn.textContent='PLAY'; playBtn.setAttribute('aria-pressed','false'); rail.querySelectorAll('.bar').forEach(b=>b.style.width='0'); }
playBtn.onclick = ()=>{ if(playing){ stopPlay(); return; } playing=true; playT=performance.now(); playBtn.textContent='PAUSE'; playBtn.setAttribute('aria-pressed','true'); if(step===4) setStep(0); };

function rebuildHeights(){ updateTerrain(); buildDeck(); buildTowers(); rebuildArcs(); applyAnim(); }

// ---------- per-frame ----------
function applyAnim(now = performance.now()){
  trG.setDrawRange(0, Math.floor(ease(S.track)*trI.length/6)*6);
  arrowMat.opacity = S.arrows;
  arrows.forEach(m=>{ m.visible = S.arrows>0.01; if(m.userData.dir){ const o=(Math.sin(now/380 + m.userData.ph)*0.5+0.5)*5; m.position.copy(m.userData.base).addScaledVector(m.userData.dir, o); } });
  fans.forEach(f=>{ const s=ease(S.fanS); f.scale.setScalar(Math.max(s,0.001)); f.visible = s>0.01; });
  fanMat.opacity = 0.2*S.fanO; fanLineMat.opacity = S.fanO;
  decks.forEach(d=>{ d.geometry.setDrawRange(0, Math.floor(ease(S.deck)*d.userData.total/3)*3); d.visible = S.deck>0.001; });
  towers.forEach((o,i)=>{ const s=ease(S.tw[i]); o.g.scale.set(1, Math.max(s,0.001), 1); o.g.visible = s>0.01; });
  if (cables) cables.material.opacity = 0.55*S.cab;
  arcMat.opacity = 0.7*S.soil;
  // soil chunks
  let n=0;
  arcs.forEach((o,fi)=>{ for (let i=0;i<soilN;i++){ const t=((now/2600) + i/soilN + fi*0.13)%1; if (S.soil>0.02){ o.curve.getPoint(t, dummy.position); dummy.scale.setScalar(S.soil*(0.6+0.6*Math.sin(i*7.1)**2)); dummy.rotation.set(i,t*6,0); } else dummy.scale.setScalar(0); dummy.updateMatrix(); soilMesh.setMatrixAt(n++, dummy.matrix); } });
  soilMesh.instanceMatrix.needsUpdate = true;
  // car laps the circuit section
  carT = (carT + 0.0016)%1; const cp = centre.getPointAt(carT), ct = centre.getTangentAt(carT);
  car.position.copy(cp); car.position.y = 1.2; car.rotation.y = Math.atan2(-ct.z, ct.x); car.visible = S.track>0.98;
}
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  const before = S.m.join()+S.basin;
  advance(dt, now);
  if (S.m.join()+S.basin !== before) updateTerrain();
  applyAnim(now);
  if (playing){ const p = (now-playT)/PLAY_MS; const bar = rail.children[step]?.querySelector('.bar'); if (bar) bar.style.width = Math.min(100,p*100)+'%';
    if (p>=1){ if (step<4){ setStep(step+1); playT=now; rail.querySelectorAll('.bar').forEach(b=>b.style.width='0'); } else stopPlay(); } }
  controls.update(); renderer.render(scene, cam); placeLabels();
  requestAnimationFrame(frame);
}
resize(); home();
updateTerrain(); buildDeck(); buildTowers();
